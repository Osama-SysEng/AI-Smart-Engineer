name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt pytest pytest-asyncio httpx aiosqlite
      - name: Run tests
        run: cd apps/api && python -m pytest tests -q
